name: Update bring copy
on:
  push:
    paths:
      - '.github/workflows/update-bring-copy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update bring section
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('<strong>Prato e talheres</strong> para a batatada.', '<strong>Prato e talheres</strong> para a batatada (mas isso forneço eu, no worries)')
          s=s.replace('Boa disposição. O resto arranja-se.', 'A malta. O resto arranja-se.')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Update what to bring copy"
          git push
